name: Build and Push Docker Image

on:
  push:
    branches:
      - feature/k8s

jobs:
  build-and-push:
    runs-on: windows-2022
    env:
      IMAGE_NAME: gedevops/speech-service

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: lsdevops
        password: Vwu2507mmoY7

    - name: Build Docker image
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:testv1 --platform windows/amd64 .

    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ env.IMAGE_NAME }}:testv1